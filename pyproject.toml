[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autonomous-job-agent"
version = "0.1.0"
description = "Self-hosted personal career agent for discovering, matching, tailoring, and applying to jobs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Autonomous Job Agent" }
]
dependencies = [
  "langgraph>=0.2.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  "python-dotenv>=1.0.1",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]
browser = [
  "browser-use>=0.1.0,<0.14.0",
  "seleniumbase>=4.34.0,<5.0.0",
]
llm = [
  "langchain>=0.3.0,<1.0.0",
  "langchain-openai>=0.2.0,<1.0.0",
]

[project.scripts]
job-agent = "job_agent.cli.run_agent:main"
job-agent-api = "job_agent.api.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
